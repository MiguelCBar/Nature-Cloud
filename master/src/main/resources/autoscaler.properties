# Configuration File for the Auto Scaler properties

checkIntervalSeconds=60
minInstances=1
maxInstances=5

# CloudWatch Physical CPU %
upperCpuThreshold=80
lowerCpuThreshold=30

# The critical physical CPU percentage that triggers a double scaling up
criticalCpuThreshold=95

# The number of instances to add/remove in a critical scaling event
criticalScalingStep=2

# CloudWatch Tuning
cloudWatchWindowMinutes=3
cloudWatchPeriodSeconds=60
bootGracePeriodSeconds=600
# How long (in seconds) to ignore a new node's CPU metrics while CloudWatch gathers data
cloudWatchWarmupSeconds=60

# Public IP retrieval
maxPublicIpAttempts=10
sleepSecondsBetweenIpAttempts=5

# Health Check Tries
maxHealthCheckTries=3