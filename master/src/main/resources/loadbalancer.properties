# Configuration File for the Load Balancer
port=8000
healthCheckPath=/

# The explicitly supported workloads (comma separated)
workloadPaths=/fractals,/dna,/grayscott

# How long (in ms) the LB waits to establish a TCP connection with the Worker
proxy.connect.timeout.ms=3000

# How long (in ms) the LB waits for the Worker to finish the calculation
proxy.read.timeout.ms=480000

# --- Fault Tolerance & Cold Starts ---
# How many times the LB will retry a request if a Worker VM crashes
lb.retry.max.attempts=3

# Number of threads in the pool that handles incoming requests and forwards them to the Workers
lb.thread.pool.size=8

# The maximum cost threshold for a request to be allowed to spill over to AWS Lambda
lb.lambda.max.cost=340141847

# The maximum load an EC2 AWS machine can handle (tested experimentally)
lb.max.allowed.load.per.node=11411149800

# The safety margin percentage required before scaling in (e.g., 0.20 for 20%)
lb.scale.in.safety.margin=0.20

